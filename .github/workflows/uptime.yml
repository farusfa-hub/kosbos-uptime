name: Uptime KosBos
run-name: ${{ inputs.rantai == '1' && 'rantai' || inputs.url && 'uji' || github.event_name == 'schedule' && 'jaga' || 'manual' }}

# Cek /api/health tiap 15 menit dari luar Vercel. Alarm hanya saat status berubah:
# issue berlabel dibuka saat mati (mention pemilik) dan ditutup saat pulih.
# Selama issue masih terbuka tidak ada alarm ulang.
#
# Pemicu 15 menit adalah RANTAI, bukan `schedule`: tiap run "rantai" mengecek, menunggu 15 menit
# lewat wait timer environment `jeda-15-menit` (tanpa memakai runner), lalu memicu run berikutnya.
# Jadwal GitHub di repo ini ternyata hanya terpicu tiap 5–8 jam (9–11 Nov 2026), jadi `schedule`
# hanya dipakai sebagai penjaga: menyalakan rantai lagi bila rantainya putus.
on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
    inputs:
      url:
        description: "Kosongkan untuk cek produksi. Isi URL lain untuk uji notifikasi (status terpisah, label uptime-uji)."
        required: false
        default: ""
      rantai:
        description: "Isi 1 untuk menyalakan rantai 15 menit. Biasanya diisi otomatis; isi manual hanya bila rantai putus."
        required: false
        default: ""

permissions: {}

jobs:
  cek:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: uptime-cek-${{ inputs.url && 'uji' || 'produksi' }}
      cancel-in-progress: false
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TARGET: ${{ inputs.url || 'https://www.kosbos.com/api/health' }}
      LABEL: ${{ inputs.url && 'uptime-uji' || 'uptime-down' }}
      NAMA: ${{ inputs.url && '[UJI] Monitor' || 'KosBos' }}
      PEMILIK: farusfa-hub
    steps:
      - name: Cek dan beri tahu bila status berubah
        run: |
          set -euo pipefail
          sekarang() { TZ=Asia/Jakarta date '+%-d %b %Y %H.%M WIB'; }

          # Tiga percobaan supaya gangguan jaringan sesaat tidak menjadi alarm.
          kode=000
          for i in 1 2 3; do
            kode=$(curl -sS -o respons.txt -m 20 -w '%{http_code}' -A kosbos-uptime "$TARGET" || true)
            kode=${kode:-000}
            echo "Percobaan $i: HTTP $kode"
            if [ "$kode" = 200 ]; then break; fi
            if [ "$i" -lt 3 ]; then sleep 30; fi
          done

          issue=$(gh issue list --label "$LABEL" --state open --limit 1 --json number --jq '.[0].number // empty')

          if [ "$kode" != 200 ]; then
            if [ -n "$issue" ]; then
              echo "Masih mati, alarm sudah ada di issue #$issue. Tidak ada alarm ulang."
            else
              {
                echo "@$PEMILIK $NAMA tidak sehat sejak pemeriksaan $(sekarang)."
                echo
                echo "- URL: $TARGET"
                echo "- HTTP: $kode"
                echo
                echo '```'
                head -c 300 respons.txt 2>/dev/null || true
                echo
                echo '```'
                echo
                echo "HTTP 402 berarti Vercel memblokir akun, biasanya karena tagihan belum lunas. Langkah pemulihan ada di docs/khz/pemulihan-produksi.md pada repo produk."
                echo
                echo "Issue ini ditutup otomatis saat pulih. Selama masih mati tidak ada alarm ulang."
              } > body.md
              gh issue create --label "$LABEL" --title "$NAMA MATI: HTTP $kode ($(sekarang))" --body-file body.md
            fi
          elif [ -n "$issue" ]; then
            gh issue comment "$issue" --body "@$PEMILIK $NAMA sudah pulih pada pemeriksaan $(sekarang): $TARGET menjawab HTTP 200. Jalankan smoke test dan rekonsiliasi di docs/khz/pemulihan-produksi.md pada repo produk."
            gh issue close "$issue"
          else
            echo "Sehat."
          fi

  # Penjaga: hanya pada run terjadwal. Menyalakan rantai bila tidak ada run "rantai" yang masih hidup.
  jaga:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      # GitHub mematikan jadwal repo publik setelah 60 hari tanpa aktivitas; panggilan ini mencegahnya.
      - name: Jaga jadwal tetap aktif
        run: gh api -X PUT "repos/$GH_REPO/actions/workflows/uptime.yml/enable" || echo "::warning::Gagal memperbarui status jadwal"
      - name: Nyalakan rantai bila putus
        run: |
          set -euo pipefail
          hidup=$(gh run list --workflow uptime.yml --event workflow_dispatch --limit 30 --json status,displayTitle \
            --jq '[.[] | select(.displayTitle == "rantai" and .status != "completed")] | length')
          if [ "$hidup" -gt 0 ]; then
            echo "Rantai hidup ($hidup run)."
          else
            echo "::warning::Rantai putus, dinyalakan lagi."
            gh workflow run uptime.yml -f rantai=1
          fi

  # Mata rantai: tunggu 15 menit (wait timer environment, tanpa runner), lalu picu run berikutnya.
  lanjut:
    needs: cek
    if: always() && inputs.rantai == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: jeda-15-menit
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_INI: ${{ github.run_id }}
    steps:
      - name: Picu run berikutnya
        run: |
          set -euo pipefail
          # Bila ada dua rantai (penjaga menyalakan saat rantai lama masih hidup), yang lebih tua berhenti.
          lebih_baru=$(gh run list --workflow uptime.yml --event workflow_dispatch --limit 30 --json databaseId,status,displayTitle \
            --jq "[.[] | select(.displayTitle == \"rantai\" and .status != \"completed\" and .databaseId > $RUN_INI)] | length")
          if [ "$lebih_baru" -gt 0 ]; then
            echo "Ada rantai yang lebih baru; rantai ini berhenti."
            exit 0
          fi
          for i in 1 2 3; do
            if gh workflow run uptime.yml -f rantai=1; then exit 0; fi
            sleep 20
          done
          echo "::error::Gagal memicu run berikutnya; penjaga terjadwal akan menyalakan rantai lagi."
          exit 1
